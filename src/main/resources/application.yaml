spring:
  application:
    name: pension-service

  data:
    redis:
      host: localhost
      port: 6380
      # Redis is only an optimisation. Without short limits, a stopped Redis would hold every request
      # (Lettuce queues commands while it reconnects and waits up to 60 s by default).
      timeout: 300ms
      connect-timeout: 300ms

  kafka:
    # Local dev broker from dev/docker-compose.yml (host port 9094). Used only for investment changes.
    bootstrap-servers: localhost:9094
    consumer:
      # A new consumer group reads the topic from the start (evicting an entry that is not there does no harm).
      # The offset is committed after each processed batch, i.e. after the cache entry was evicted.
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      # Used only to park events on the dead-letter topic.
      acks: all
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

  http:
    clients:
      # Applied by Boot to every RestClient built from the injected builder.
      # A slow core fails fast instead of holding up the caller.
      connect-timeout: 1s
      read-timeout: 2s

  security:
    oauth2:
      # Incoming calls: only the portal-bff may call this service (service token, audience pension-service).
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pension
          audiences: pension-service
      # Outgoing calls: this service gets its own token for the core (client credentials).
      client:
        registration:
          core:
            provider: keycloak
            client-id: pension-service
            # No default on purpose. Boot keeps an unresolved placeholder as literal text, so
            # CoreClientConfig.requireClientSecret makes the service refuse to start without it.
            client-secret: ${PENSION_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: core.read
        provider:
          keycloak:
            # Explicit token-uri (not issuer-uri) so the service can start even when Keycloak is down.
            token-uri: http://localhost:8180/realms/pension/protocol/openid-connect/token

server:
  port: 8082

pension-cache:
  participation-ttl: 15m
  projection-ttl: 6h
  valuation-ttl: 1h
  holdings-ttl: 1h
  transactions-ttl: 5m
  transaction-detail-ttl: 10m
  investment-profile-ttl: 1h

core-api:
  base-url: http://localhost:8081

# What the back office reports back (see package investmentchange): a completed request evicts the cached profile.
pension-service:
  investment-change:
    kafka-enabled: true
    status-changed-topic: pension.change-request.status-changed
    group-id: pension-service-profile-cache

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
